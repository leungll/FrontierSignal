# Phase 1 scoring is keyword-based. Phase 2 replaces `topics` with an embedding
# interest-vector; the kill_list stays as a hard veto at every phase.

# Matched against title + summary. Each hit adds `weight` to the score.
topics:
  # Narrowed: bare "agent" also fires on AI-safety/philosophy chatter ("why agents
  # lie/cheat"). Require an engineering context word near "agent" (either order,
  # within a sentence-ish window) so we match agent *engineering*, not agent
  # *discourse*. The eng-word list covers building, running, and tooling agents.
  - { pattern: "(?i)\\bagent(ic)?\\b.{0,60}\\b(runtime|loop|harness|framework|orchestrat|tool|memory|build|deploy|production|serving|eval|architecture|ide|coding|sdk|rollout|workflow|pipeline|infra)\\b", weight: 1.2 }
  - { pattern: "(?i)\\b(runtime|loop|harness|framework|orchestrat|tool|memory|build|deploy|production|serving|eval|architecture|ide|coding|sdk|rollout|workflow|pipeline|infra)\\b.{0,60}\\bagent(ic)?s?\\b", weight: 1.0 }
  - { pattern: "(?i)\\bagent(ic)? (runtime|loop|harness|framework)\\b", weight: 1.2 }
  - { pattern: "(?i)\\b(llm|model) serving\\b",                 weight: 1.2 }
  - { pattern: "(?i)\\binference (engine|optimi|latency|throughput)", weight: 1.2 }
  - { pattern: "(?i)\\b(vllm|sglang|tensorrt|triton)\\b",        weight: 1.2 }
  - { pattern: "(?i)\\beval(uation)?s?\\b",                      weight: 1.0 }
  - { pattern: "(?i)\\bcontext (engineering|window|management)\\b", weight: 1.2 }
  - { pattern: "(?i)\\bmemory\\b",                               weight: 0.8 }
  - { pattern: "(?i)\\bmcp\\b|model context protocol",           weight: 1.2 }
  - { pattern: "(?i)\\btool (calling|use)\\b",                   weight: 1.2 }
  - { pattern: "(?i)\\bai infra(structure)?\\b",                 weight: 1.2 }
  - { pattern: "(?i)\\bdistributed (training|inference|systems)\\b", weight: 1.0 }
  - { pattern: "(?i)\\bai coding\\b|coding agent",               weight: 1.0 }
  - { pattern: "(?i)\\bproduction\\b",                           weight: 0.7 }
  - { pattern: "(?i)\\bself[- ]improv(ing|ement)\\b",            weight: 1.0 }
  - { pattern: "(?i)\\blong[- ]running\\b",                      weight: 0.8 }
  - { pattern: "(?i)\\b(rag|retrieval[- ]augmented)\\b",         weight: 0.6 }
  - { pattern: "(?i)\\b(benchmark|throughput|latency|kv[- ]cache)\\b", weight: 0.9 }
  - { pattern: "(?i)\\b(architecture|internals|deep dive|post[- ]mortem)\\b", weight: 0.8 }

# Hard veto — any hit drops the item regardless of topic score.
kill_list:
  title_patterns:
    - "(?i)\\braises?\\b.*\\b(series [a-e]|seed|\\$\\d+\\s*[mb])\\b"
    - "(?i)\\b(valuation|ipo|acquires?|acquisition|funding round)\\b"
    - "(?i)\\b(top|best) \\d+\\b|\\bultimate guide\\b|\\byou should know\\b"
    - "(?i)\\bai (regulation|policy|bill|act|executive order|lawsuit)\\b"
    - "(?i)\\b(hiring|we're hiring|join our team|careers)\\b"
    # AI-safety/alignment philosophy & society think-pieces are not engineering.
    # (A concrete eval methodology still gets in — it won't match these phrasings.)
    - "(?i)\\bai (ethics|alignment debate|existential|doom|sentience|consciousness)\\b"
    - "(?i)\\b(future|end) of (work|academia|science|humanity)\\b"
  domains:
    - techcrunch.com
    - venturebeat.com
    - businessinsider.com

# ---------------------------------------------------------------------------
# Scoring. Keyword `topics` above only pre-filter the firehose sources and act as
# the fallback when no LLM is configured. The real ranking is the LLM's three
# independent 0-10 judgments (see radar/pipeline/llm_filter.py for the rubric):
#   relevance — how directly it bears on building/running/evaluating AI systems
#   impact    — how much the underlying development changes what practitioners
#               know or can do (judged on the development, not the post's length)
#   depth     — how much concrete technical substance the text carries
# combined as score = weights · (relevance, impact, depth). So an item earns its
# place either by being a big development (a frontier model launch) or by being
# substantive engineering (a detailed write-up) — no per-topic special cases.
score_weights: { relevance: 0.45, impact: 0.35, depth: 0.20 }
# Items at/above this combined score qualify for the daily report.
min_report_score: 6.0
# Gate: must be at least this relevant to AI engineering...
min_relevance: 5
# ...unless it is a field-level milestone (impact >= this), e.g. an AI-solved
# open math problem, which is worth knowing even when off-topic.
milestone_impact: 9

# Keyword-only threshold, used when the LLM is unavailable.
min_score: 1.0
# Max items in a daily report.
max_report_items: 8
# Even on a quiet day, report at least this many — taking the best eligible items
# down to floor_min_score, never below it (a short report beats padding).
floor_report_items: 3
floor_min_score: 5.0
# How many of the selected items are marked P0 (the must-reads at the top). The
# rest become P1 (rendered in a collapsible section). Fewer = more selective P0.
p0_count: 3

# Balance caps: at most this many items of one kind per report, so no single
# kind of content crowds out the rest. Relaxed only to reach the floor.
# Content types (judged by the LLM): release | research | engineering | news |
# opinion | promo. `engineering` (technical write-ups) is deliberately uncapped.
# 0 excludes a type outright.
type_caps:
  research: 3     # papers are valuable but must not dominate
  release: 3      # launches matter, but a launch-heavy day shouldn't be all launches
  news: 1
  opinion: 1
  promo: 0        # marketing, contests, case studies, partnerships

# Per-source caps: max items a single source may contribute to one report.
# Sources not listed here are uncapped.
source_caps:
  arxiv: 3
  hackernews: 2   # community signal, keep it a garnish

# High-volume sources and how many of their items (best keyword score first) the
# LLM judges per run. Every other source is curated and low-volume, so ALL of its
# posts are judged — keywords never decide whether a curated post is seen.
firehose_budget:
  arxiv: 25
  hackernews: 15
