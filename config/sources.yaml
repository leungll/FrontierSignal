# RSS/Atom sources. Add sources here, not in code.
#
# authority: 0.0-1.0, hand-tuned. Two effects:
#   - amplifies keyword score (a trusted source's relevant item ranks higher)
#   - >= trusted_authority (0.9) → "fast lane": every post is judged by Claude
#     regardless of keyword score, so landmark posts aren't buried.
#
# All URLs verified live 2026-08. Feeds marked "mirror" have no official RSS;
# they use a community RSSHub route and may lag or break — swap if they die.

sources:
  # ---------- Frontier labs (authority 0.9-1.0: fast-lane, landmark-aware) ----------
  - id: anthropic
    name: Anthropic
    # No official RSS; community RSSHub mirror of anthropic.com/news.
    url: https://rsshub.bestblogs.dev/anthropic/news
    authority: 1.0

  - id: openai
    name: OpenAI
    url: https://openai.com/news/rss.xml
    authority: 1.0

  - id: deepmind
    name: Google DeepMind
    url: https://deepmind.google/blog/rss.xml
    authority: 0.95

  - id: googleai
    name: Google AI
    url: https://blog.google/technology/ai/rss/
    authority: 0.9

  - id: googleresearch
    name: Google Research
    url: https://research.google/blog/rss/
    authority: 0.9

  - id: metaai
    name: Meta AI
    # No official RSS; community RSSHub mirror of ai.meta.com/blog.
    url: https://rsshub.bestblogs.dev/meta/ai/blog
    authority: 0.9

