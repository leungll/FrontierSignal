[project]
name = "frontier-signal"
version = "0.1.0"
description = "Frontier AI engineering papers, ideas, and systems — filtered and ranked daily"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lili Liang", email = "l.liang0316@gmail.com" }]
keywords = ["ai", "llm", "agents", "digest", "lark", "feishu", "rss", "arxiv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "typer>=0.12",
    "structlog>=24.1",
    "anthropic>=0.40",
    "openai>=1.40",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/ll-leung/ai-research-radar"
Repository = "https://github.com/ll-leung/ai-research-radar"
Issues = "https://github.com/ll-leung/ai-research-radar/issues"

[project.scripts]
radar = "radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
